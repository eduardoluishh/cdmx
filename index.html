<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa apocalíptico de la Ciudad de México</title>
<meta name="description" content="Alertas de Protección Civil, el Popocatépetl, sismos, aire y ciclones en el Valle de México, con datos oficiales. Un día a la vez.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap">
<style>
/* VOICE: irónico en los titulares, exacto en los datos; nunca se burla de quien sufre un desastre.
   IDEA: el cartucho de 16 bits del Valle de México convertido en tablero de fin del mundo cotidiano.
   PICTURE: la cuenca pixel por pixel; las amenazas del día se ven actuar encima.
   COLOUR and TYPE: noche de 16 bits; los colores de alerta son los oficiales (verde a púrpura); Silkscreen + IBM Plex Sans.
   LAYOUT: mapa a pantalla completa, nivel de apocalipsis arriba a la izquierda, fichas a la derecha. */
:root{
  --ink:#0d0507; --box:#1e0c11; --box-2:#33121a; --paper:#f4e6d6; --muted:#c9a7a0;
  --gold:#ffc21a; --sky:#7a1c1c; --cold:#7cc6ff; --heat:#ff6a3d;
  --f-display:"Silkscreen","Courier New",monospace;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#160709;color:var(--paper);font:16px/1.45 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.dragging{cursor:grabbing}#map.hovering{cursor:pointer}
.box{background:var(--box);border:4px solid var(--paper);box-shadow:0 0 0 4px var(--ink),8px 8px 0 4px rgba(13,5,7,.45)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:3px dashed var(--gold);outline-offset:3px}

.hud{position:fixed;z-index:5;top:calc(16px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;width:min(340px,calc(100vw - 32px))}
.title{padding:12px 14px 10px}
.title h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:25px;line-height:.95;letter-spacing:1px;color:var(--gold);text-shadow:3px 3px 0 #8a1414}
.title h1 small{display:block;font-size:15px;color:var(--paper);text-shadow:2px 2px 0 var(--ink);margin-bottom:3px;letter-spacing:2px}
.title p{margin:8px 0 0;font-size:14px;color:var(--muted);line-height:1.3}
.month{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 6px;border-width:3px;box-shadow:0 0 0 3px var(--ink)}
.month b{font-family:var(--f-display);font-weight:400;font-size:14px;letter-spacing:1px;text-align:center;flex:1}
.month b small{display:block;font-size:10px;color:var(--muted);letter-spacing:1px}
.month button{width:40px;height:40px;font-family:var(--f-display);font-size:18px;color:var(--gold)}
.lvl{display:block;width:100%;text-align:left;padding:8px 10px;border-width:3px;box-shadow:0 0 0 3px var(--ink)}
.lvl small{display:block;font-family:var(--f-display);font-size:10px;letter-spacing:1px;color:var(--muted)}
.lvl b{display:block;font-family:var(--f-display);font-weight:400;font-size:14px;letter-spacing:.5px;margin-top:4px}
.lvl .meter{display:flex;gap:4px;margin-top:5px}.lvl .meter i{flex:1;height:10px;box-shadow:0 0 0 2px var(--ink);outline:1px solid #5a1a22}
.quip{margin:0 0 12px;font-size:14px;font-style:italic;color:var(--gold)}
.alist,.hist,.qlist{list-style:none;margin:0 0 12px;padding:0}
.alist li{border-left:6px solid;padding:4px 0 4px 10px;margin-bottom:8px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.alist a{color:var(--muted);font-size:12px}
.hist li{font-size:13px;color:var(--muted);margin:4px 0}.hist i{display:inline-block;width:9px;height:9px;margin-right:6px;box-shadow:0 0 0 1px var(--ink)}
.hist a{color:inherit}.hist button{text-decoration:underline;padding:0;color:var(--paper)}
.qlist li{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.qlist .mg{font-family:var(--f-display);font-size:13px;text-align:center;padding:4px 0;color:#1a1430;box-shadow:0 0 0 2px var(--ink)}
.qlist small{display:block;color:var(--muted);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:7px;padding:6px 9px;font-family:var(--f-display);font-size:11px;letter-spacing:.5px;background:var(--box);border:3px solid var(--paper);box-shadow:0 0 0 3px var(--ink);min-height:34px}
.chip .ic{width:12px;height:12px;flex:none;box-shadow:0 0 0 2px var(--ink)}
.chip.off{opacity:.55;border-style:dashed}
.chip[aria-pressed="true"]{background:var(--gold);color:#1a1430;opacity:1;border-style:solid}
.chip .s{width:6px;height:6px;background:#7dff8a;box-shadow:0 0 0 1px var(--ink)}
.chip.off .s{display:none}

.tr{position:fixed;z-index:5;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));display:flex;gap:12px;align-items:flex-start}
.pbtn{font-family:var(--f-display);font-size:14px;letter-spacing:1px;color:#1a1430;background:var(--gold);padding:9px 12px;border:3px solid var(--ink);box-shadow:inset -3px -3px 0 #c99a00,inset 3px 3px 0 #ffe98a,4px 4px 0 rgba(13,5,7,.5);min-width:44px;min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pbtn:active{transform:translate(2px,2px)}
.pbtn.ghost[aria-pressed="false"]{opacity:.6}
#zroads{font-size:8px;letter-spacing:0;padding:9px 2px}
.pbtn.ghost{background:var(--box);color:var(--paper);box-shadow:inset -3px -3px 0 #1a0508,inset 3px 3px 0 #5a1a22,4px 4px 0 rgba(13,5,7,.5)}
.pbtn.cold{background:var(--cold);box-shadow:inset -3px -3px 0 #3b8fd0,inset 3px 3px 0 #c6e7ff,4px 4px 0 rgba(13,5,7,.5)}
.pbtn[aria-pressed="true"].ghost{background:var(--gold);color:#1a1430}
.livedot{display:inline-block;width:9px;height:9px;background:#ff2a2a;box-shadow:0 0 0 2px var(--ink);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.zoom{position:fixed;z-index:5;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(38px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.zoom .pbtn{width:48px;height:48px;font-size:22px;padding:0}
.foot{position:fixed;z-index:4;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(38px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;font-family:var(--f-display);font-size:12px;pointer-events:none}
.scale{padding:6px 8px 4px}.scale .bar{height:8px;border:3px solid var(--paper);border-top:0;margin-bottom:4px;box-sizing:border-box}
.coords{padding:6px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
body.has-card .foot{display:none}
body.panel-open .card{right:calc(370px + env(safe-area-inset-right,0px))}
@media (min-width:641px){body.has-card .zoom{display:none}}

.panel{position:fixed;z-index:7;top:calc(80px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(38px + env(safe-area-inset-bottom,0px));width:330px;display:flex;flex-direction:column}
.panel header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:3px solid var(--paper)}
.panel h2{margin:0;font-family:var(--f-display);font-size:15px;color:var(--gold);display:flex;align-items:center;gap:9px}
.livemeta{margin:0;padding:8px 12px;font-size:13px;line-height:1.4;color:var(--muted);border-bottom:2px solid var(--box-2)}
.livemeta a{color:inherit}
.plist{list-style:none;margin:0;padding:6px;overflow:auto;flex:1;min-height:0}
.plist button{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 8px}
.plist button:hover{background:var(--box-2)}
.plist .t{font-family:var(--f-display);font-size:15px;text-align:center;padding:4px 0;color:#1a1430;box-shadow:0 0 0 2px var(--ink)}
.plist .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .n small{display:block;font-size:12px;color:var(--muted)}
.plist .w{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.plist .grp{font-family:var(--f-display);font-size:11px;color:var(--muted);letter-spacing:1px;padding:10px 8px 4px}

.card{position:fixed;z-index:6;right:calc(16px + env(safe-area-inset-right,0px));top:calc(84px + env(safe-area-inset-top,0px));width:min(390px,calc(100vw - 32px));max-height:calc(100vh - 140px);overflow:auto;box-sizing:border-box;padding:14px 16px 16px}
.card .top{display:flex;align-items:flex-start;gap:10px}
.card h3{margin:0;font-family:var(--f-display);font-size:21px;line-height:1.1;flex:1;text-wrap:balance}
.card .x{width:40px;height:40px;font-family:var(--f-display);font-size:18px;color:var(--muted);flex:none}
.tag{display:inline-block;font-family:var(--f-display);font-size:11px;letter-spacing:1px;padding:3px 7px;margin:8px 6px 0 0;color:#1a1430;background:var(--muted)}
.tag.on{background:#7dff8a}.tag.cdmx{background:var(--gold)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:14px 0 12px}
.stats dt{font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted)}
.stats dd{margin:2px 0 0;font-size:16px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums}
.fact{margin:0 0 12px;line-height:1.5;font-size:15px;padding-left:12px;border-left:4px solid var(--gold)}
.where{margin:0 0 12px;font-size:14px;color:var(--muted)}
.src{margin:0 0 12px;font-size:12px;color:var(--muted);line-height:1.45}
.src a,.attrib a,.about a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tags button{font-family:var(--f-display);font-size:11px;padding:6px 8px;border:2px solid var(--paper);min-height:32px}
.tags button:hover{background:var(--box-2)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.attrib{position:fixed;z-index:9;right:0;bottom:0;max-width:100%;box-sizing:border-box;margin:0;padding:3px max(10px,env(safe-area-inset-right,0px)) calc(3px + env(safe-area-inset-bottom,0px)) 10px;font:11px/1.35 var(--f-body);color:#f0dcd4;background:rgba(13,5,7,.78);text-align:right}
.attrib button{font:inherit;padding:0;text-decoration:underline;color:inherit}

.about{position:fixed;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100vw - 40px));max-height:calc(100vh - 80px);overflow:auto;padding:16px 18px;box-sizing:border-box;line-height:1.45}
.about h2{margin:0 0 8px;font-family:var(--f-display);font-size:16px;color:var(--gold)}
.about p,.about li{margin:0 0 9px;font-size:14px}
.about ul{padding-left:18px;margin:0 0 10px}
.loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#160709}
.loading .box{padding:22px 26px;text-align:center;max-width:320px}
.loading strong{font-family:var(--f-display);font-size:18px;color:var(--gold);display:block}
.loading p{margin:8px 0 0;color:var(--muted);font-size:15px}
.pbar{height:14px;border:3px solid var(--paper);margin-top:14px;padding:2px;box-sizing:border-box}
.pbar i{display:block;height:100%;width:30%;background:repeating-linear-gradient(90deg,#e5342b 0 8px,var(--gold) 8px 16px);animation:slide 1.2s steps(8) infinite}
@keyframes slide{to{margin-left:70%}}

@media (max-width:640px){
  .title{padding:9px 11px 7px}.title h1{font-size:19px}.title h1 small{font-size:12px}.title p{display:none}
  .hud{gap:10px;width:calc(100vw - 92px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px))}
  .legend{flex-wrap:nowrap;overflow-x:auto;margin:0 -4px;padding:4px;scrollbar-width:none}
  .legend::-webkit-scrollbar{display:none}.chip{flex:none}
  #liveLbl{display:none}#liveBtn{padding:0;width:44px}
  .lvl b{font-size:12px}.lvl{padding:6px 8px}
  .tr{flex-direction:column;align-items:flex-end;gap:10px}
  .chip{font-size:10px;padding:4px 7px;min-height:30px}
  .legend{gap:6px}
  .panel{left:12px;right:12px;width:auto;top:calc(16px + env(safe-area-inset-top,0px))}
  .card,body.panel-open .card{left:12px;right:12px;width:auto;top:auto;bottom:calc(44px + env(safe-area-inset-bottom,0px));max-height:58vh}
  body.has-card .zoom,body.has-card .legend,body.has-card .lvl{display:none}
  .zoom,.foot{bottom:calc(44px + env(safe-area-inset-bottom,0px))}
  .zoom .pbtn{width:44px;height:44px}
  .coords{display:none}
  .attrib{left:0;text-align:center;font-size:10px}
}
@media (prefers-reduced-motion:reduce){.livedot,.pbar i{animation:none}}
</style>
</head>
<body>
<canvas id="map" aria-label="Mapa interactivo de alertas y riesgos del Valle de México"></canvas>

<div class="hud">
  <div class="title box"><h1><small id="hSmall">MAPA APOCALÍPTICO DE LA</small><span id="hBig">CIUDAD DE MÉXICO</span></h1><p id="subtitle">Un día a la vez</p></div>
  <button class="lvl box" id="lvl" aria-label="Nivel de apocalipsis"></button>
  <div class="legend" id="legend"></div>
</div>

<div class="tr">
  <button class="pbtn ghost" id="langBtn" aria-label="Read in English" title="English">EN</button>
  <button class="pbtn ghost" id="aboutBtn" aria-label="Cómo usar el mapa" title="Cómo usar el mapa">?</button>
  <button class="pbtn" id="liveBtn" aria-expanded="false" aria-controls="panel"><span class="livedot" aria-hidden="true"></span><span id="liveLbl">AHORA</span></button>
</div>

<aside class="panel box" id="panel" hidden>
  <header><h2><span class="livedot" aria-hidden="true"></span><span id="panelH">El clima ahora</span></h2><button class="pbtn ghost" id="closePanel" aria-label="Cerrar" style="min-height:36px;min-width:36px;padding:4px 8px">×</button></header>
  <p class="livemeta" id="liveMeta">Consultando Open-Meteo…</p>
  <ul class="plist" id="plist"></ul>
</aside>

<div class="zoom">
  <button class="pbtn" id="zin" aria-label="Acercar">+</button>
  <button class="pbtn" id="zout" aria-label="Alejar">−</button>
  <button class="pbtn ghost" id="zroads" aria-pressed="true" title="Calles"><span id="zroadsT">CALLES</span></button>
  <button class="pbtn ghost" id="zhome" aria-label="Ver todo el valle" title="Ver todo el valle">⌂</button>
</div>
<div class="foot"><div class="scale box"><div class="bar" id="sbar" style="width:80px"></div><span id="slabel">5 km</span></div><div class="coords box" id="coords">—</div></div>

<section class="card box" id="card" hidden aria-live="polite"></section>

<footer class="attrib" id="attrib"></footer>

<div class="about box" id="about" hidden role="dialog" aria-label="Acerca del mapa"><div id="aboutBody"></div><button class="pbtn" id="closeAbout">OK</button></div>

function build(){

const monthWindWest=m=>m>=5&&m<=9;
function spawnStorm(kind){

  for(let k=0;k<40;k++){const x=rnd()*EW,y=rnd()*EH,i=(y|0)*EW+(x|0),e=E2[i],lon=invLon(2*x);
    const west=lon<-99.15?1:lon<-98.9?.45:.25;
    if(e>2500&&e<3900&&rnd()<west){storms.push({x,y,r:0,max:kind==='granizo'?9+rnd()*5:8+rnd()*8,age:0,life:260+rnd()*200,vx:.05+rnd()*.06,vy:-.02-rnd()*.04,kind});return;}}
}

    if(ALERTT){for(let k=0;k<260;k++){const x=(rnd()*EW)|0,y=(rnd()*EH)|0,b=ALERTT[y*EW+x];if(!b)continue;
      if(b&1){if(parts.length<500)parts.push({x,y,vx:-.05,vy:.9,l:0,m:16,c:rnd()<.5?'#2a5fd6':'#9cc4ff'});}

    for(const q of parts){q.l++;q.x+=q.vx*dt*.06;q.y+=q.vy*dt*.06;q.vy+=(rnd()-.5)*.01;const s=q.l>90?2:1,a=Math.min(1,.95*(1-q.l/q.m)+.05);
      fg.globalAlpha=a;fg.fillStyle=q.l<25?'#3d404a':q.l<120?'#6f7684':'#a3abbb';fg.fillRect(q.x|0,q.y|0,s,s);}

    ctx.strokeStyle='#ff4d4d';ctx.lineWidth=1.5;ctx.stroke();ctx.setLineDash([]);if(r>40)txt(L('12 km: zona de exclusión','12 km exclusion zone'),sx,sy+r+16,11,'#ffb3b3','center','b');}

async function loadData(){
  try{const r=await fetch('data/alertas.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);DATA=await r.json();DATAERR=false;}
  catch(_){DATAERR=true;}
  prepData();renderLegend();renderLevel();renderPanel();

}
const fresh=a=>{const now=Date.now();return(!a.hasta||Date.parse(a.hasta)>now);};

  HZL.alertas=ALERTS.reduce((m,a)=>Math.max(m,NIVEL[a.nivel]||0),0);
  const P=D.popo||{};HZL.popo=!P.semaforo?0:P.semaforo==='rojo'?(P.fase>=2?4:3):P.semaforo==='amarillo'?(P.fase>=3?2:P.fase===2?1:0):0;

  const S=D.sismos||{},day=Date.now()-864e5,all=[...(S.lista||[]),...(S.semana||[])];
  const recent=all.filter(q=>Date.parse(q.t)>day);
  QUAKE=[...(S.lista||[])].sort((a,b)=>b.m-a.m)[0]||null;
  HZL.sismos=recent.reduce((m,q)=>{const d=kmTo(q.lat,q.lon);return Math.max(m,q.m>=7?3:(q.m>=6&&d<500)?2:(q.m>=5&&d<200)?1:0);},0);
  const C=(D.ciclones||{}).lista||[];HZL.ciclones=C.reduce((m,c)=>{const d=kmTo(c.lat,c.lon);return d>800?m:Math.max(m,/hurricane|hurac/i.test(c.tipo||'')||c.tipo==='HU'?2:1);},0);

  // capa de alcaldías con alerta (rejilla de efectos)
  if(!IDM)return;
  const im=new ImageData(EW,EH),o=new Uint32Array(im.data.buffer);ALERTT=new Uint8Array(EN);
  for(let y=0;y<EH;y++)for(let x=0;x<EW;x++){const k=IDM[Math.min(H-1,2*y)*W+Math.min(W-1,2*x)];if(!k)continue;const p=PL[k-1],v=ALC.get(p.id);if(!v)continue;
    const lv=v.reduce((m,a)=>Math.max(m,NIVEL[a.nivel]||0),0),i=y*EW+x;let bits=0;for(const a of v)bits|=a.tipo==='lluvia'||a.tipo==='granizo'?1:a.tipo==='frio'||a.tipo==='nieve'?2:a.tipo==='calor'?4:8;ALERTT[i]=bits;
    const kk=(xx,yy)=>IDM[Math.min(H-1,2*yy)*W+Math.min(W-1,2*xx)],edge=kk(x+1,y)!==k||kk(x-1,y)!==k||kk(x,y+1)!==k||kk(x,y-1)!==k;
    if(edge)o[i]=u32(rgb(LVCOL[lv]),255);else if((x+y)%4<2)o[i]=u32(rgb(LVCOL[lv]),120);}
  ALERTC=mk(EW,EH);ALERTC.getContext('2d').putImageData(im,0,0);
  // bruma del aire con el color del índice
  if(HAZEC&&ai){const src=HAZEC.getContext('2d').getImageData(0,0,EW,EH).data,am=new ImageData(EW,EH),ao=new Uint32Array(am.data.buffer),col=rgb(LVCOL[ai[0]]);
    for(let i=0;i<EN;i++)if(src[i*4+3]||(U2[i]===1&&(i%3===0)))ao[i]=u32(mix([150,120,95],col,.7),190);AIREC=mk(EW,EH);AIREC.getContext('2d').putImageData(am,0,0);}
}

// Vías principales de OpenStreetMap (esquema OpenMapTiles, servidas por OpenFreeMap): autopistas, primarias, secundarias y carriles de Metrobús.
// Coordenadas en 1e-4° desde la esquina noroeste, por diferencias, en varints zigzag y comprimidas.
let ROADS=null,SNAMES=[],SHOWROADS=true;
async function loadRoads(){
  const b=atob(document.getElementById('roads').textContent.trim()),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  const d=new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer());
  let i=0;const rv=()=>{let r=0,sh=0,x;do{x=d[i++];r+=(x&127)*2**sh;sh+=7;}while(x>127);return r%2?-(r+1)/2:r/2;};
  const sx=1e-4/RES,sy=1e-4/KY;ROADS=[];
  for(let c=0;c<4;c++){const n=rv(),P=new Path2D();
    for(let j=0;j<n;j++){const m=rv();let x=0,y=0;for(let k=0;k<m;k++){x+=rv();y+=rv();k?P.lineTo(x*sx,y*sy):P.moveTo(x*sx,y*sy);}}
    ROADS.push(P);}
  SNAMES=JSON.parse(document.getElementById('streetnames').textContent).map(([n,x,y,a,r])=>({n,x:x*sx,y:y*sy,a,r})).sort((p,q)=>q.r-p.r);
}

  if(rz>2.5){line(ROADS[2],2.6*k,'#0d0507',.55);line(ROADS[2],1.1*k,'#f1efe6',.75);}
  if(rz>1.3){line(ROADS[1],3.6*k,'#0d0507',.8);line(ROADS[1],1.7*k,'#f1efe6',.95);}
  line(ROADS[0],(rz>1.3?4.6:3.4)*k,'#0d0507',rz>1.3?.9:.7);line(ROADS[0],(rz>1.3?2.4:1.5)*k,'#ffd23f',rz>1.3?1:.85);

  for(const s of SNAMES){if(s.r<minR)continue;const[sx,sy]=w2s(s.x,s.y);if(sx<20||sx>vw-20||sy<20||sy>vh-20)continue;
    const prev=seen.get(s.n);if(prev&&prev.some(([x,y])=>Math.hypot(x-sx,y-sy)<260))continue;
    const w=ctx.measureText(s.n).width+8,h=14,c=Math.abs(Math.cos(s.a)),sn=Math.abs(Math.sin(s.a)),bw=w*c+h*sn,bh=w*sn+h*c,b=[sx-bw/2,sy-bh/2,sx+bw/2,sy+bh/2];
    if(boxes.some(o=>b[0]<o[2]&&b[2]>o[0]&&b[1]<o[3]&&b[3]>o[1]))continue;boxes.push(b);(prev||seen.set(s.n,[]).get(s.n)).push([sx,sy]);
    let a=s.a;if(a>Math.PI/2)a-=Math.PI;else if(a<-Math.PI/2)a+=Math.PI;
    ctx.save();ctx.translate(sx,sy);ctx.rotate(a);ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3;ctx.lineJoin='round';ctx.strokeStyle='#0d0507';ctx.strokeText(s.n,0,0);ctx.fillStyle=s.r===3?'#ffe98a':'#f1efe6';ctx.fillText(s.n,0,0);ctx.restore();}
  ctx.textBaseline='alphabetic';
}

  ctx.fillStyle='#160709';ctx.fillRect(0,0,vw,vh);
  // retícula de fondo fuera del valle
  ctx.fillStyle='rgba(255,70,40,.07)';for(let x=(-cam.x*cam.z+vw/2)%32;x<vw;x+=32)ctx.fillRect(x|0,0,1,vh);for(let y=(-cam.y*cam.z+vh/2)%32;y<vh;y+=32)ctx.fillRect(0,y|0,vw,1);

const pointers=new Map();let drag=null,pinch=null,moved=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});fly=null;moved=0;
  if(pointers.size===1)drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};
  if(pointers.size===2){const[a,b]=[...pointers.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.z};drag=null;}});
cv.addEventListener('pointermove',e=>{
  if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pointers.size===2){const[a,b]=[...pointers.values()];zoomAt((a.x+b.x)/2,(a.y+b.y)/2,pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d);moved+=10;return;}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.hypot(dx,dy));if(moved>4){cv.classList.add('dragging');cam.x=drag.cx-dx/cam.z;cam.y=drag.cy-dy/cam.z;}}
  else{const p=pick(e.clientX,e.clientY);cv.classList.toggle('hovering',!!p);}
  const[wx,wy]=s2w(e.clientX,e.clientY);if(wx>=0&&wy>=0&&wx<W&&wy<H){const la=invLat(wy),lo=invLon(wx);coords.textContent=`${Math.abs(la).toFixed(3)}°N ${Math.abs(lo).toFixed(3)}°${L('O','W')} · ${Math.round(elevAtXY(wx,wy)/10)*10} m`;}});
const end=e=>{pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;
  if(drag&&moved<=4){const p=pick(e.clientX,e.clientY,true);if(p)selectPlace(p);}
  drag=null;cv.classList.remove('dragging');};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
cv.addEventListener('wheel',e=>{e.preventDefault();fly=null;zoomAt(e.clientX,e.clientY,cam.z*Math.exp(-e.deltaY*(e.deltaMode?.05:.0016)));},{passive:false});
function pick(sx,sy,area){let best=null,bd=18;for(const p of PL){if(!p.feat)continue;const[x,y]=w2s(p.x,p.y),d=Math.hypot(x-sx,y-sy);if(d<bd){bd=d;best=p;}}
  if(best||!area)return best;const[wx,wy]=s2w(sx,sy);if(wx<0||wy<0||wx>=W||wy>=H)return null;const k=IDM[(wy|0)*W+(wx|0)];return k?PL[k-1]:null;}

const panel=document.getElementById('panel'),plist=document.getElementById('plist'),liveMeta=document.getElementById('liveMeta');
async function loadLive(){
  const LP=PL.filter(p=>p.area);
  const u=`https://api.open-meteo.com/v1/forecast?latitude=${LP.map(p=>p.lat.toFixed(4)).join(',')}&longitude=${LP.map(p=>p.lon.toFixed(4)).join(',')}&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m&timezone=America%2FMexico_City`;
  try{const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);const r=await fetch(u,{signal:ctl.signal});clearTimeout(to);if(!r.ok)throw new Error(r.status);
    const j=await r.json(),arr=Array.isArray(j)?j:[j];LIVE={};arr.forEach((o,i)=>{if(o&&o.current&&LP[i])LIVE[LP[i].id]=o.current;});liveErr=false;liveTime=arr[0]&&arr[0].current&&arr[0].current.time;}
  catch(_){liveErr=true;}
  renderPanel();if(selected)selectPlace(selected,false);
}

  document.getElementById('zin').setAttribute('aria-label',L('Acercar','Zoom in'));document.getElementById('zout').setAttribute('aria-label',L('Alejar','Zoom out'));
  {const zr=document.getElementById('zroads');zr.setAttribute('aria-label',L('Mostrar u ocultar calles','Show or hide streets'));zr.title=L('Calles','Streets');document.getElementById('zroadsT').textContent=L('CALLES','STREETS');}
  document.getElementById('zhome').setAttribute('aria-label',L('Ver todo el valle','Show the whole valley'));
  cv.setAttribute('aria-label',L('Mapa interactivo de alertas y riesgos del Valle de México','Interactive map of alerts and hazards in the Valley of Mexico'));
  document.getElementById('attrib').innerHTML=L('Fuentes: <a href="https://x.com/SGIRPC_CDMX" target="_blank" rel="noopener">SGIRPC</a> · <a href="http://www.ssn.unam.mx/" target="_blank" rel="noopener">SSN-UNAM</a> · <a href="https://www.gob.mx/cenapred" target="_blank" rel="noopener">Cenapred</a> · <a href="http://www.aire.cdmx.gob.mx/" target="_blank" rel="noopener">Sedema</a> · <a href="https://www.nhc.noaa.gov/" target="_blank" rel="noopener">NHC</a> · <a href="https://www.inegi.org.mx/temas/mg/" target="_blank" rel="noopener">INEGI</a> · Calles: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a> · Por <a href="https://eduardoluis.blog" target="_blank" rel="noopener">Eduardo Luis</a> · <button id="infoBtn">Información</button>',
    'Sources: <a href="https://x.com/SGIRPC_CDMX" target="_blank" rel="noopener">SGIRPC</a> · <a href="http://www.ssn.unam.mx/" target="_blank" rel="noopener">SSN-UNAM</a> · <a href="https://www.gob.mx/cenapred" target="_blank" rel="noopener">Cenapred</a> · <a href="http://www.aire.cdmx.gob.mx/" target="_blank" rel="noopener">Sedema</a> · <a href="https://www.nhc.noaa.gov/" target="_blank" rel="noopener">NHC</a> · <a href="https://www.inegi.org.mx/temas/mg/" target="_blank" rel="noopener">INEGI</a> · Streets: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a> · By <a href="https://eduardoluis.blog" target="_blank" rel="noopener">Eduardo Luis</a> · <button id="infoBtn">About</button>');
  document.getElementById('infoBtn').onclick=document.getElementById('aboutBtn').onclick;
  renderLegend();renderLevel();renderPanel();
  if(!card.hidden){if(card.dataset.kind==='phen'&&active)openPhen(active,true);else if(card.dataset.kind==='level')openLevel();else if(selected)selectPlace(selected,false);}
}
document.getElementById('langBtn').onclick=()=>{LANG=LANG==='en'?'es':'en';try{localStorage.setItem('cdmx-lang',LANG);}catch(_){}applyLang();};

// ===================== Arranque =====================
resize();
setTimeout(async()=>{
  try{await loadDEM();try{await loadRoads();}catch(_){ROADS=null;}}catch(err){document.getElementById('loadP').textContent=L('Tu navegador no pudo abrir los datos del relieve. Prueba con una versión reciente de Chrome, Safari o Firefox.','Your browser couldn’t open the terrain data. Try a recent version of Chrome, Safari or Firefox.');return;}
  build();const h=home();cam.x=h.x;cam.y=h.y;cam.z=h.z;
  applyLang();scaleBar();
  await loadData();
  setActive(ALERTS.length?PHI.alertas:PHI.popo);
  document.getElementById('loading').hidden=true;requestAnimationFrame(frame);loadLive();
  setInterval(loadData,10*60*1000);
},30);
}
